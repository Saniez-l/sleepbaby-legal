<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SleepBaby - Nouveau mot de passe</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #060B15;
      color: #ffffff;
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 90vh;
    }
    .card {
      background-color: #121824;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      box-sizing: border-box;
    }
    h2 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 24px;
      font-size: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #b3b9c6;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px;
      background-color: #1e2638;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #ffffff;
      font-size: 16px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #2563eb;
    }
    .button {
      width: 100%;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    .button:disabled {
      background-color: #1e293b;
      color: #64748b;
      cursor: not-allowed;
    }
    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
      text-align: center;
    }
    .error {
      background-color: #7f1d1d;
      color: #fca5a5;
    }
    .success {
      background-color: #064e3b;
      color: #6ee7b7;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Nouveau mot de passe</h2>
    
    <div id="msgBox" class="message"></div>

    <form id="resetForm" onsubmit="handleReset(event)">
      <div class="form-group">
        <label for="password">Nouveau mot de passe (6 caractères min.)</label>
        <input type="password" id="password" required minlength="6">
      </div>
      
      <div class="form-group">
        <label for="confirmPassword">Confirmez le mot de passe</label>
        <input type="password" id="confirmPassword" required minlength="6">
      </div>
      
      <button type="submit" id="submitBtn" class="button">Mettre à jour</button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://nbgwpbjqhcepvkishweh.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5iZ3dwYmpxaGNlcHZraXNod2VoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NjQ2OTAsImV4cCI6MjA5MzI0MDY5MH0.1JbUpKHPqxV79Mwm6sQTdlETrfWvFKg7nhtOR46pnUk'; 

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function handleReset(event) {
      event.preventDefault();
      
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const msgBox = document.getElementById('msgBox');
      const submitBtn = document.getElementById('submitBtn');

      // 1. Vérification locale de correspondance
      if (password !== confirmPassword) {
        msgBox.textContent = "❌ Les mots de passe ne correspondent pas.";
        msgBox.className = "message error";
        msgBox.style.display = "block";
        return;
      }

      submitBtn.disabled = true;
      msgBox.style.display = "none";

      try {
        // 2. Récupération des jetons de l'URL du mail
        const urlParams = new URLSearchParams(window.location.search);
        const tokenHash = urlParams.get('token_hash');
        const type = urlParams.get('type');

        if (!tokenHash || type !== 'recovery') {
          throw new Error("Le lien de réinitialisation est manquant, invalide ou a expiré.");
        }

        // 3. Authentification via le token_hash
        const { error: verifyError } = await supabaseClient.auth.verifyOtp({
          token_hash: tokenHash,
          type: 'recovery',
        });

        if (verifyError) throw verifyError;

        // 4. Application du nouveau mot de passe
        const { error: updateError } = await supabaseClient.auth.updateUser({
          password: password
        });

        if (updateError) throw updateError;

        // Victoire !
        msgBox.textContent = "✅ Mot de passe modifié avec succès ! Vous pouvez à présent vous connecter sur l'application SleepBaby.";
        msgBox.className = "message success";
        msgBox.style.display = "block";
        document.getElementById('resetForm').reset();
        
      } catch (error) {
        msgBox.textContent = "❌ Erreur : " + error.message;
        msgBox.className = "message error";
        msgBox.style.display = "block";
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
